[package]
name = "scopic"
version = "0.1.0"
edition = "2024"
description = "A side-by-side terminal viewer for Git and Jujutsu diffs"
repository = "https://github.com/coltonhyer/scopic"
license = "MIT OR Apache-2.0"
keywords = ["diff", "git", "jujutsu", "terminal", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.agents", "/.github", "/.gitattributes", "/.gitignore", "/AGENTS.md", "/BACKLOG.md", "/CLAUDE.md"]

[dependencies]
ratatui = "0.30.2"
# In pager mode stdin is the diff pipe, so crossterm reads keys from /dev/tty,
# which mio/kqueue can't poll on macOS; use-dev-tty selects its poll(2) source.
crossterm = { version = "0.29", features = ["use-dev-tty", "osc52"] }
similar = { version = "3.1.2", features = ["unicode"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
